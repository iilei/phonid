name: Validate Public Presets

on:
  pull_request:
    paths:
      - 'public_presets/**.toml'
  push:
    paths:
      - 'public_presets/**.toml'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests:  write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to verify signed commits

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build phonid CLI
        run: |
          go build -o phonid ./cmd/phonid
          chmod +x phonid

      - name: Verify file naming convention
        run: |
          echo "Checking preset naming conventions..."
          for file in public_presets/.*.toml; do
            filename=$(basename "$file")
            if [[ ! "$filename" =~ ^\..*\.phonidrc\.toml$ ]]; then
              echo "❌ Invalid filename: $filename"
              echo "   Must match pattern: .*.phonidrc.toml"
              exit 1
            fi
            echo "✓ Valid filename: $filename"
          done

      - name: Validate preset configurations
        run: |
          echo "Validating preset configurations..."
          EXIT_CODE=0

          for preset in public_presets/.*.toml; do
            echo ""
            echo "Validating: $preset"
            echo "----------------------------------------"

            # Run preflight checks
            if ! ./phonid --config "$preset" 0; then
              echo "❌ Preflight checks failed for: $preset"
              EXIT_CODE=1
            else
              echo "✓ Preflight checks passed for: $preset"
            fi
          done

          exit $EXIT_CODE


      - name: Test WASM build with new presets
        run: |
          echo "Testing WASM build..."
          ./scripts/build-wasm.sh

          # Verify presets are included in build
          if [ ! -d "dist/wasm/public_presets" ]; then
            echo "❌ public_presets not copied to dist/wasm"
            exit 1
          fi

          preset_count=$(find dist/wasm/public_presets -name '*.toml' | wc -l)
          echo "✓ WASM build includes $preset_count preset(s)"

      - name: Generate random examples for changed presets
        if: github.event_name == 'pull_request'
        run: |
          # Build the random examples generator
          go build -o generate-random-examples .github/scripts/generate-random-examples.go

          # Create output directory
          mkdir -p /tmp/random-examples

          # Get changed preset files
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^public_presets/.*\.toml$' > /tmp/changed-presets.txt || true

          # Generate examples for each changed preset
          if [ -s /tmp/changed-presets.txt ]; then
            while IFS= read -r preset; do
              if [ -f "$preset" ]; then
                preset_name=$(basename "$preset")
                echo "Generating examples for $preset_name..."
                ./generate-random-examples "$preset" > "/tmp/random-examples/${preset_name}.md"
              fi
            done < /tmp/changed-presets.txt
          fi

      - name: Comment on PR with validation results
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Get files changed in this PR
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            // Filter for preset files
            const changedPresets = files
              .filter(f => f.filename.startsWith('public_presets/') && f.filename.endsWith('.phonidrc.toml'))
              .map(f => f.filename.split('/').pop()); // Get just the filename

            // Build random examples section
            let randomExamplesSection = '';
            for (const preset of changedPresets) {
              const exampleFile = `/tmp/random-examples/${preset}.md`;
              if (fs.existsSync(exampleFile)) {
                const examples = fs.readFileSync(exampleFile, 'utf8').trim();
                let presetNameClean = preset.replace(/^\./, '').replace('.phonidrc.toml', '');
                presetNameClean = (presetNameClean.charAt(0).toUpperCase() + presetNameClean.slice(1)).replaceAll('_', ' ')
                randomExamplesSection += `\n\n**_${presetNameClean}_**\n\n${examples}\n`;
              }
            }

            const comment = `## Preset Validation Results

            ✅ All validation checks passed!

            **Presets affected by this PR:**
            ${changedPresets.map(p => `- \`https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/master/public_presets/${p}\``).join('\n')}

            **Random Examples**
            ${randomExamplesSection || '\n*No examples generated*'}

            **Checks performed:**
            - ✓ File naming conventions
            - ✓ Preflight validation
            - ✓ WASM build compatibility
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
