# Output of 'phonid preflight --suggest'
#
# Capacity per word: 242 combinations (0-242)
#
# Pattern Requirements:
#   - Pattern Length: Must be 5, 7, 11, 13, 23, 29, 31, 37, 41, 43, or 47 characters
#     (e.g., CVCVC, CVCVCVC)
#   - Vowels (V): Length 5 needs ≥3 vowels; length 7+ needs ≥2 vowels
#   - Consonants (C): Need ≥3 characters (e.g., "bzk" or "bdfghjklmnprstvz")
#
# Available Placeholders:
#   C = Consonants, V = Vowels, L = Liquids (l,m,n,r)
#   N = Nasals, S = Sibilants, F = Fricatives
#   X/Y/Z = Custom categories

[phonetic]
  patterns = ['CVCVC']

  [phonetic.placeholders]
    C = 'bzt'
    V = 'eio'

# Suggested preflight checks:

[[preflight]]
  input = '0'           # Lower boundary (CVCVC)
  output = 'bebeb'

[[preflight]]
  input = '121'         # Mid-range (CVCVC)
  output = 'ziziz'

[[preflight]]
  input = '242'         # Upper boundary (CVCVC)
  output = 'totot'
