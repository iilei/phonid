version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: phonid-unix
    main: ./cmd/phonid
    binary: phonid
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: phonid-windows
    main: ./cmd/phonid
    binary: phonid
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: unix-archives
    builds:
      - phonid-unix
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    files:
      - README.md
      - LICENSE
      - example.phonidrc

  - id: windows-archives
    builds:
      - phonid-windows
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: zip
    files:
      - README.md
      - LICENSE
      - example.phonidrc

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

signs:
  - cmd: gpg
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
    artifacts: checksum
    output: true

release:
  prerelease: auto
  draft: false
  replace_existing_draft: true
  make_latest: true
  mode: replace
  header: |
    ## Phonid {{ .Tag }} ({{ .Date }})

    Phonetic identifier generator - converts numbers to pronounceable identifiers.
  footer: |
    **Full Changelog**: https://github.com/iilei/phonid/compare/{{ .PreviousTag }}...{{ .Tag }}

    ## Installation

    ### Binary Download
    Download the appropriate binary for your platform from the assets below.

    ### Using Go
    ```bash
    go install github.com/iilei/phonid/cmd/phonid@{{ .Tag }}
    ```
